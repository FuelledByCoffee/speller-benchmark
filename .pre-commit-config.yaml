repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use the latest version available
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0 # Matches the LLVM/Clang version you want to target
    hooks:
      - id: clang-format
        # Optional: restrict to specific file extensions if needed
        types_or: [c++, c, javascript, objective-c, java, c#]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.28.1
    hooks:
      - id: gersemi
